name: Nightly ML Retrain

on:
  schedule:
    # Runs at 3:00 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab anytime!

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Endpoint
        run: |
          curl --fail-with-body --silent --show-error --request POST \
          'https://cognicore-workspace.onrender.com/api/model/retrain' \
          --header "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
