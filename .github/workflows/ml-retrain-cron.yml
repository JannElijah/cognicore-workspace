name: Nightly ML Retrain

on:
  schedule:
    # Runs at 3:00 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab anytime!

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST 'https://cognicore-workspace.onrender.com/api/model/retrain' \
            -H "X-Cron-Secret: ${CRON_SECRET}"
