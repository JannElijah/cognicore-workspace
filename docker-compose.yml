version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognicore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize the database with the schema
      - ./server/supabase_migration.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cognicore
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=local_development_secret
      - FLASK_ENV=development
      - CORS_ORIGINS=*
      - DB_MIN_CONN=1
      - DB_MAX_CONN=10
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
